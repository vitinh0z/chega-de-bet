name: chega-de-bet

services:
  # ===================== Aplicação =====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdb-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/chegadebet
      DB_USERNAME: chegadebet
      DB_PASSWORD: chegadebet
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ===================== Banco de dados =====================
  postgres:
    image: postgres:18.4
    container_name: cdb-postgres
    environment:
      POSTGRES_DB: chegadebet
      POSTGRES_USER: chegadebet
      POSTGRES_PASSWORD: chegadebet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chegadebet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== Observabilidade =====================
  # Métricas (scrape do /actuator/prometheus da aplicação)
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: cdb-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Agregação de logs
  loki:
    image: grafana/loki:3.7.3
    container_name: cdb-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  # Coleta os logs dos contêineres e envia ao Loki (substitui o Promtail, agora EOL)
  alloy:
    image: grafana/alloy:v1.18.0
    container_name: cdb-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki
    restart: unless-stopped

  # Dashboards (datasources de Prometheus + Loki já provisionados)
  grafana:
    image: grafana/grafana:12.3.8
    container_name: cdb-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
  loki-data:
