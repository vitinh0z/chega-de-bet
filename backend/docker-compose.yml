# Stack de PRODUÇÃO (Fase 1): só o que precisa rodar na VM.
#
#   docker compose up -d --build          # ou: make up-prod
#
# Prometheus, Loki e Grafana NÃO estão aqui de propósito. Juntos consomem mais RAM que
# o próprio backend em idle, o que anulava o ganho de caber no free tier ao lado do
# Postgres. Na VM fica só o Alloy (~30-50 MB), que envia métricas e logs para o
# Grafana Cloud.
#
# Para a stack completa em desenvolvimento, some o overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#   # ou, mais curto: make up
name: chega-de-bet

services:
  # ===================== Aplicação =====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdb-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-chegadebet}
      DB_USERNAME: ${DB_USERNAME:-chegadebet}
      DB_PASSWORD: ${DB_PASSWORD:-chegadebet}
      # Cria o primeiro moderador na subida, e só com a tabela vazia. Deixe em branco
      # depois que a conta existir. Ver BootstrapModerador.
      CHEGADEBET_MODERACAO_BOOTSTRAP_LOGIN: ${CHEGADEBET_MODERACAO_BOOTSTRAP_LOGIN:-}
      CHEGADEBET_MODERACAO_BOOTSTRAP_SENHA: ${CHEGADEBET_MODERACAO_BOOTSTRAP_SENHA:-}
    ports:
      # Só a porta da API. A 8081 (Actuator) fica sem publicar de propósito: as
      # métricas são alcançáveis apenas de dentro desta rede, pelo Alloy.
      - "8080:8080"
    restart: unless-stopped

  # ===================== Banco de dados =====================
  postgres:
    image: postgres:18.4
    container_name: cdb-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-chegadebet}
      POSTGRES_USER: ${DB_USERNAME:-chegadebet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chegadebet}
    ports:
      # Exposto apenas ao localhost: não fica acessível na LAN
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-chegadebet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===================== Coleta =====================
  # Único agente de observabilidade da VM: faz scrape das métricas da app e lê os logs
  # dos contêineres, mandando tudo para o Grafana Cloud. Não guarda nada localmente.
  alloy:
    image: grafana/alloy:v1.18.0
    container_name: cdb-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      # Vêm do .env ao lado deste arquivo (git-ignorado). Ver .env.example.
      # Os dois usuários são numéricos e DIFERENTES entre si.
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # UI de diagnóstico do Alloy, só no localhost da VM.
      - "127.0.0.1:12345:12345"
    restart: unless-stopped

volumes:
  postgres-data:
