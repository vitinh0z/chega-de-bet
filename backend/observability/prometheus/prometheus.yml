global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métricas expostas pelo Actuator/Micrometer da aplicação.
  # 8081 é a porta de gestão (management.server.port), acessível só na rede interna
  # do compose — a 8080, publicada, não serve mais o Actuator.
  - job_name: chega-de-bet-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]

  # Auto-monitoramento do Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
