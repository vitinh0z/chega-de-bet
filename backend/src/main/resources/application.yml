spring:
  application:
    name: chega-de-bet-backend

  threads:
    # Cada requisição HTTP passa a rodar em uma virtual thread, em vez de disputar as 200
    # threads de plataforma do pool do Tomcat.
    #
    # Vale a pena aqui porque o trabalho desta API é quase todo espera de I/O: consulta ao
    # Postgres e, no caminho da denúncia, nada de CPU. Com o pool fixo, 200 requisições
    # lentas de banco esgotam o pool e a 201ª fica na fila, mesmo com a CPU ociosa. Com
    # virtual thread, quem espera I/O devolve a carrier thread e não ocupa nada.
    #
    # Só é seguro a partir do Java 24: até o 23, um bloco 'synchronized' que fizesse I/O
    # prendia a carrier thread (pinning), e o pool efetivo voltava a ser o número de
    # núcleos. O JEP 491 acabou com isso, e este projeto roda em Java 25.
    #
    # O limite real deixa de ser o pool e passa a ser o pool de conexões do HikariCP —
    # que é o que ele deveria ter sido desde sempre.
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chegadebet}
    username: ${DB_USERNAME:chegadebet}
    password: ${DB_PASSWORD:chegadebet}

  jpa:
    open-in-view: false
    hibernate:
      # 'validate': o schema é controlado pelo Flyway, não pelo Hibernate
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Actuator / observabilidade
management:
  server:
    # Porta separada, que o docker-compose NÃO publica: o Actuator passa a ser
    # alcançável só de dentro da rede interna (Prometheus), e não pela internet.
    # Antes disso, /actuator/prometheus respondia na mesma 8080 exposta ao mundo.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Documentação da API
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Regras do domínio
chegadebet:
  token:
    # Validade do token efêmero (ISO-8601). Encurtar é resposta a incidente:
    # por isso vive aqui e não numa constante compilada.
    ttl: PT24H

    # Limite de emissão por origem. Folgado de propósito: com CGNAT de operadora
    # móvel muita gente compartilha um IP, e bloquear denunciante real é o erro caro.
    # Um uso normal gasta 1 token por dia, então 30/h só incomoda quem automatiza.
    rate-limit:
      capacidade: 30
      janela: PT1H
      # Teto de origens acompanhadas ao mesmo tempo (~100k baldes ≈ poucos MB).
      max-chaves: 100000

  moderacao:
    # Moderadores DISTINTOS necessários para aprovar um domínio da allowlist.
    quorum-minimo: 2
    # Allowlist de proteção: bloquear por engano causa dano grave. Casa o host exato
    # e os subdomínios (noticias.gov.br entra; malgov.br não).
    allowlist:
      - gov.br
      - jus.br
      - jogadoresanonimos.org.br
    # Denunciantes distintos NOVOS, após a última rejeição, que devolvem o domínio à fila.
    limiar-reabertura: 5

  # Pré-análise de domínio: busca sinais de aposta no HTML e entrega evidência ao
  # moderador. Nunca decide status sozinha. Ver docs/pre-analise-scraping.md.
  scraper:
    # Desligue aqui se a pré-análise incomodar um alvo ou estourar o orçamento de rede.
    habilitado: true
    # De quanto em quanto tempo o worker drena a fila. A fila EM_ANALISE só encolhe por
    # decisão humana, então um intervalo curto só repetiria trabalho já feito.
    intervalo: PT5M
    # O pior TTFB medido foi 0,73s. 5s cobre rede ruim sem prender a thread.
    timeout-conexao: PT5S
    # Teto da requisição inteira: pega o alvo que entrega 1 byte por segundo.
    timeout-total: PT15S
    # O sinal mora no <head>, nos primeiros 0,4% do documento. 100KB é folga larga.
    max-bytes: 100KB
    # Identificável de propósito: quem for raspado consegue descobrir quem raspou.
    user-agent: "ChegaDeBet-PreAnalise/1.0 (+https://github.com/vitinh0z/chega-de-bet)"
    # Corta laço de redirecionamento. Cada hop é revalidado contra SSRF.
    max-redirects: 3
    # 2 = uma repetição, só para falha transitória. Nunca insista em 403 ou 429.
    max-tentativas: 2
    espera-entre-tentativas: PT2S
    # Domínio já tentado só volta à fila depois disto, com ou sem sucesso.
    cooldown: PT24H
    # Protege a VM da Fase 1 e evita virar enxurrada na perspectiva de quem recebe.
    concorrencia: 5
    # Teto de domínios por ciclo: limita a memória de uma execução.
    lote-maximo: 50
