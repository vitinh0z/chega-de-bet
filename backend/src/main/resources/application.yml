spring:
  application:
    name: chega-de-bet-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chegadebet}
    username: ${DB_USERNAME:chegadebet}
    password: ${DB_PASSWORD:chegadebet}

  jpa:
    open-in-view: false
    hibernate:
      # 'validate': o schema é controlado pelo Flyway, não pelo Hibernate
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Actuator / observabilidade
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Documentação da API
springdoc:
  swagger-ui:
    path: /swagger-ui.html
